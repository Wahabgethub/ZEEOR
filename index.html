<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c211c" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zeeor.shop/" />
    <meta name="description" content="ZEEOR — Wear Without Limits. Pakistan's multi-vendor fashion marketplace: shop women's and men's clothing online, or open your own store on zeeor.shop." />

    <!-- Open Graph / social -->
    <meta property="og:site_name" content="ZEEOR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZEEOR — Wear Without Limits" />
    <meta property="og:description" content="Shop women's and men's fashion across Pakistan, or become a seller and open your own shop on ZEEOR." />
    <meta property="og:image" content="https://zeeor.shop/zeeor-editorial.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1500" />
    <meta property="og:url" content="https://zeeor.shop/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZEEOR — Wear Without Limits" />
    <meta name="twitter:description" content="Pakistan's multi-vendor fashion marketplace. Shop now or open your own store." />
    <meta name="twitter:image" content="https://zeeor.shop/zeeor-editorial.jpg" />

    <!-- Favicons — every size Google's favicon crawler and mobile home-screens ask for,
         so the default browser globe icon never shows. Generate the actual PNG files
         with scripts/generate-favicons.mjs before your first production build. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/zeeor-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ZEEOR — Wear Without Limits</title>

    <!-- Static Knowledge Graph baseline: Organization + WebSite + SiteNavigationElement.
         Category/product/store pages inject their own richer, live JSON-LD server-side
         (see server/seoRoutes.js) — this block just covers the homepage shell so it's
         correct even before the server middleware runs (e.g. `vite dev`). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://zeeor.shop/#organization",
      "name": "ZEEOR",
      "alternateName": "ZEEOR Fashion Store",
      "url": "https://zeeor.shop/",
      "slogan": "WEAR WITHOUT LIMITS",
      "logo": { "@type": "ImageObject", "url": "https://zeeor.shop/zeeor-logo.png", "width": 1080, "height": 1080 },
      "image": "https://zeeor.shop/zeeor-logo.png",
      "description": "ZEEOR is a Pakistani multi-vendor fashion marketplace — local shop owners open their own store on zeeor.shop and sell alongside the main ZEEOR catalog.",
      "foundingLocation": { "@type": "Place", "name": "Pakistan" },
      "areaServed": { "@type": "Country", "name": "Pakistan" },
      "hasMerchantReturnPolicy": {
        "@type": "MerchantReturnPolicy",
        "applicableCountry": "PK",
        "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow",
        "merchantReturnDays": 14,
        "returnMethod": "https://schema.org/ReturnByMail",
        "itemCondition": "https://schema.org/NewCondition"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://zeeor.shop/#website",
      "url": "https://zeeor.shop/",
      "name": "ZEEOR",
      "publisher": { "@id": "https://zeeor.shop/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": { "@type": "EntryPoint", "urlTemplate": "https://zeeor.shop/?q={search_term_string}" },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SiteNavigationElement",
      "name": ["Women", "Men", "Hoodies", "Trousers", "T-Shirts", "Outerwear", "Accessories", "Knitwear", "Stores"],
      "url": ["https://zeeor.shop/women", "https://zeeor.shop/men", "https://zeeor.shop/hoodies", "https://zeeor.shop/trousers", "https://zeeor.shop/t-shirts", "https://zeeor.shop/outerwear", "https://zeeor.shop/accessories", "https://zeeor.shop/knitwear", "https://zeeor.shop/stores"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
