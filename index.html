<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c211c" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Faique" />
    <link rel="canonical" href="https://zeeor.shop/" />
    <meta name="description" content="ZEEOR is a Pakistani marketplace built by two university students. Sellers open their own shops here, so you find everyday wear and daily items in one place." />

    <!-- Open Graph / social -->
    <meta property="og:site_name" content="ZEEOR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZEEOR — Pakistan's Marketplace for Everyday Wear" />
    <meta property="og:description" content="Discover everyday wear from sellers across Pakistan, or open your own shop on ZEEOR. Built by two university students." />
    <meta property="og:image" content="https://zeeor.shop/zeeor-logo.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="ZEEOR — Wear Without Limits" />
    <meta property="og:url" content="https://zeeor.shop/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZEEOR — Pakistan's Marketplace for Everyday Wear" />
    <meta name="twitter:description" content="Discover everyday wear from sellers across Pakistan, or open your own shop on ZEEOR. Built by two university students." />
    <meta name="twitter:image" content="https://zeeor.shop/zeeor-logo.png" />

    <!-- Favicons — every size Google's favicon crawler and mobile home-screens ask for,
         so the default browser globe icon never shows. Generate the actual PNG files
         with scripts/generate-favicons.mjs before your first production build. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/zeeor-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ZEEOR — Pakistan's Online Marketplace | Wear Without Limits</title>

    <!-- Static Knowledge Graph baseline: Organization + WebSite + SiteNavigationElement.
         Category/product/store pages inject their own richer, live JSON-LD server-side
         (see server/seoRoutes.js) — this block just covers the homepage shell so it's
         correct even before the server middleware runs (e.g. `vite dev`). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://zeeor.shop/#organization",
      "name": "ZEEOR",
      "alternateName": "ZEEOR Fashion Store",
      "url": "https://zeeor.shop/",
      "slogan": "WEAR WITHOUT LIMITS",
      "logo": { "@type": "ImageObject", "url": "https://zeeor.shop/zeeor-logo.png", "width": 1080, "height": 1080 },
      "image": "https://zeeor.shop/zeeor-logo.png",
      "description": "ZEEOR is a Pakistani online marketplace founded by two university students. Local sellers open their own shops on zeeor.shop and sell everyday clothing and daily-use items to customers across Pakistan.",
      "foundingLocation": { "@type": "Place", "name": "Pakistan" },
      "areaServed": { "@type": "Country", "name": "Pakistan" },
      "hasMerchantReturnPolicy": {
        "@type": "MerchantReturnPolicy",
        "applicableCountry": "PK",
        "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow",
        "merchantReturnDays": 14,
        "returnMethod": "https://schema.org/ReturnByMail",
        "itemCondition": "https://schema.org/NewCondition"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://zeeor.shop/#website",
      "url": "https://zeeor.shop/",
      "name": "ZEEOR",
      "publisher": { "@id": "https://zeeor.shop/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": { "@type": "EntryPoint", "urlTemplate": "https://zeeor.shop/?q={search_term_string}" },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
